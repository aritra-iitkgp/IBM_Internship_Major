{% extends 'layout.html' %}

{% block body %}

<!-- Page Header -->
<header class="masthead"
    style="background-image: url('{{ url_for('static', filename='assets/img/ibm_business_image.jpg') }}')">
    <div class="container position-relative px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <div class="page-heading">
                    <h1>Sign Up</h1>
                    <span class="subheading">Create your account to get started</span>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="mb-4">
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-6 col-lg-5">

                <form method="POST" action="/signup">
                    <!-- Name -->
                    <div class="form-floating mb-3">
                        <input class="form-control" id="name" name="name" type="text" placeholder="Enter your name"
                            required>
                        <label for="name">Full Name</label>
                    </div>

                    <!-- Email -->
                    <div class="form-floating mb-3">
                        <input class="form-control" id="email" name="email" type="email" placeholder="Enter your email"
                            required>
                        <label for="email">Email Address</label>
                    </div>

                    <!-- Password -->
                    <div class="form-floating mb-3">
                        <input class="form-control" id="password" name="password" type="password"
                            placeholder="Enter your password" required>
                        <label for="password">Password</label>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-floating mb-3">
                        <input class="form-control" id="confirm_password" name="confirm_password" type="password"
                            placeholder="Confirm your password" required>
                        <label for="confirm_password">Confirm Password</label>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button class="btn btn-primary btn-lg" type="submit">Sign Up</button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <p>Already have an account? <a href="{{ url_for('home') }}">Sign In</a></p>
                </div>

            </div>
        </div>
    </div>
</main>

{% endblock %}
